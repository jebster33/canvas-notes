<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canvas Notes sync</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0e0f13;color:#e8e8ef;font:15px/1.5 system-ui,sans-serif}main{max-width:460px;padding:24px}code{background:#1a1b22;padding:2px 6px;border-radius:5px}small{color:#8b8e9a}</style>
</head><body><main>
<h1>Canvas Notes sync server</h1>
<p>This server is running. In Canvas Notes open <b>App settings &rarr; Sync</b>, paste this site's address and your <code>CANVAS_SYNC_TOKEN</code>.</p>
<p id="s"><small>Checking&hellip;</small></p>
<script>fetch("/api/health").then(r=>r.json()).then(j=>{document.getElementById("s").innerHTML=j.configured?"&#9989; Ready.":"&#9888;&#65039; Set the CANVAS_SYNC_TOKEN environment variable (16+ characters) and redeploy."}).catch(()=>{document.getElementById("s").textContent="The API isn't answering yet."})</script>
</main></body></html>
